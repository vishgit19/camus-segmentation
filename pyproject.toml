[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camus-segmentation"
version = "0.1.0"
description = "Echocardiography segmentation with patient-level evaluation"
requires-python = ">=3.9"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "torch>=2.6,<3", "SimpleITK>=2.4,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "ruff>=0.8,<1"]

[project.scripts]
camus = "camus_seg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
